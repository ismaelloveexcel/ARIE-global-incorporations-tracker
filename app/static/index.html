<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arie Finance · Incorporation Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="decision-ui">
    <div class="loading-overlay" id="loadingOverlay" hidden role="status" aria-live="assertive" aria-busy="false">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Loading leads…</p>
    </div>

    <header class="header header--minimal">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">A</span>
          <div>
            <p class="brand-eyebrow">Arie Finance</p>
            <h1>Incorporation Monitor</h1>
          </div>
        </div>
        <div class="header-actions">
          <label class="header-date">
            <span class="visually-hidden">Snapshot date</span>
            <select id="dateSelect" class="date-select date-select--header" aria-label="Snapshot date"></select>
          </label>
          <button type="button" class="btn-icon" id="refreshBtn" aria-label="Refresh register data" title="Refresh register data">↻</button>
          <details class="header-utilities header-utilities--icon">
            <summary class="btn-icon" aria-label="Settings" title="Settings">⚙</summary>
            <div class="header-utilities__panel">
              <label class="toggle toggle--compact">
                <input type="checkbox" id="demoMode" checked />
                <span id="demoModeLabel">Cap UK volume (top 25 by score)</span>
              </label>
              <a class="btn btn-ghost btn-sm" href="/dev" target="_blank" rel="noopener">Operations</a>
            </div>
          </details>
        </div>
      </div>
    </header>

    <div class="shell">
      <section class="decision-hero" aria-label="Today's priorities">
        <div class="decision-hero__copy">
          <p class="decision-hero__eyebrow" id="queueHeroEyebrow">Incorporation snapshot</p>
          <h2 class="decision-hero__date" id="queueHeroDate">—</h2>
          <div class="decision-hero__stats" id="queueHeroStats"></div>
          <p class="decision-hero__updated" id="queueHeroRefreshed">—</p>
        </div>
        <div class="decision-hero__action">
          <button type="button" class="btn btn-primary btn-lg" id="reviewHighPriorityBtn">Review pursue-now leads</button>
          <p id="dateSelectEmpty" class="date-empty-msg" hidden>No snapshots available</p>
          <div class="decision-hero__date-nav visually-hidden" id="dateNav" aria-hidden="true">
            <button type="button" id="datePrev" tabindex="-1">Previous</button>
            <button type="button" id="dateNext" tabindex="-1">Next</button>
          </div>
        </div>
      </section>

      <p class="queue-guidance" id="tabGuidance" aria-live="polite"></p>
      <div id="dataStatusBanner" class="data-status-banner" hidden aria-live="polite"></div>

      <main class="main">
        <div class="notice-banner notice-mu-missing" id="mauritiusMissingNotice" hidden>
          <p id="mauritiusMissingText"></p>
          <p class="notice-mu-hint" id="mauritiusMissingHint" hidden>
            <code id="muPipelineCmd"></code>
            <button type="button" class="btn btn-ghost btn-sm" id="copyMuCmd">Copy</button>
          </p>
        </div>

        <form class="decision-bar" id="filtersForm" aria-label="View and search">
          <div class="view-mode" id="viewMode" role="group" aria-label="View mode">
            <button type="button" class="view-mode__btn active" data-view="pursue">High priority</button>
            <button type="button" class="view-mode__btn" data-view="strong">Strong</button>
            <button type="button" class="view-mode__btn" data-view="all">All</button>
          </div>
          <label class="decision-bar__search">
            <span class="visually-hidden">Search company</span>
            <input type="search" id="filterSearch" name="search" placeholder="Search company…" autocomplete="off" />
          </label>
        </form>

        <section class="panel table-panel table-panel--minimal" aria-labelledby="panelTitle">
          <div class="panel-head panel-head-row">
            <div>
              <h2 id="panelTitle" class="visually-hidden">Lead queue</h2>
              <p id="panelSubtitle" class="panel-subtitle-muted">Loading…</p>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="exportBtn" title="Export filtered leads to CSV">Export</button>
          </div>
          <div class="table-wrap table-wrap--soft">
            <table id="leadsTable">
              <caption class="visually-hidden">Leads to review — open a row for full detail</caption>
              <thead>
                <tr>
                  <th scope="col" data-sort="company_name" class="sortable">Company</th>
                  <th scope="col" data-sort="score" class="sortable">Score</th>
                  <th scope="col">Reason</th>
                  <th scope="col" data-sort="assigned_to" class="sortable">Assigned</th>
                  <th scope="col" class="col-chevron"><span class="visually-hidden">Open</span></th>
                </tr>
              </thead>
              <tbody id="leadsBody">
                <tr><td colspan="5" class="empty">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div class="detail-backdrop" id="detailBackdrop" hidden></div>
    <aside class="detail-panel" id="detailPanel" hidden role="dialog" aria-modal="true" aria-labelledby="detailCompanyName">
      <header class="detail-header">
        <h2 id="detailCompanyName">Lead profile</h2>
        <button type="button" class="btn-close" id="detailClose" aria-label="Close panel">×</button>
      </header>
      <div class="detail-body" id="detailBody"></div>
    </aside>

    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
