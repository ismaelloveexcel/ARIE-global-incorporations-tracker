name: Test alert email (Outlook)

on:
  workflow_dispatch:

jobs:
  send_test:
    name: Send test email
    runs-on: ubuntu-latest
    steps:
      - name: Send test via Outlook SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: ${{ secrets.ALERT_EMAIL_FROM }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "✅ ARIE — Outlook alert test"
          to: isudally@outlook.com
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            This is a one-time test from GitHub Actions.

            If you received this, ALERT_EMAIL_FROM and ALERT_EMAIL_PASSWORD are configured correctly.
