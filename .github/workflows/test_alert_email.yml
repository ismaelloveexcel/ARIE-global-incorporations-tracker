name: Test alert email (SendGrid)

on:
  workflow_dispatch:

jobs:
  send_test:
    name: Send test email
    runs-on: ubuntu-latest
    steps:
      - name: Send test via SendGrid
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          secure: false
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "✅ ARIE — SendGrid alert test"
          to: ismael@ariefinance.com
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            This is a one-time test from GitHub Actions via SendGrid.

            If you received this, SENDGRID_API_KEY and ALERT_EMAIL_FROM are configured correctly for pipeline alerts.
