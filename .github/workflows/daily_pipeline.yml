# ─── ALERT SETUP ─────────────────────────────────────
# Before this works, add two secrets in GitHub:
# Settings → Secrets and variables → Actions → New secret
#
# ALERT_EMAIL_FROM     your Outlook/Office365 address
#                      e.g. ismael@ariefinance.com
# ALERT_EMAIL_PASSWORD your Outlook password
#   If MFA is enabled on your account:
#   → Go to mysignins.microsoft.com
#   → Security info → Add sign-in method
#   → App password → Create
#   → Copy the generated password exactly
#
# If email fails with "SmtpClientAuthentication is disabled":
#   → Microsoft 365 admin must enable SMTP AUTH for this mailbox
#   → https://aka.ms/smtp_auth_disabled
# ─────────────────────────────────────────────────────

name: Incorporation Intelligence Engine — Daily Pipeline

on:
  schedule:
    # Runs at 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Specific date to process (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""
      lookback:
        description: "Number of days back to fetch (ignored when date is set)."
        required: false
        default: "1"
      skip_difc:
        description: "Skip DIFC scraper (true/false)"
        required: false
        default: "false"
      skip_mauritius:
        description: "Skip Mauritius MNS scraper (true/false)"
        required: false
        default: "false"
      dry_run:
        description: "Dry run — parse and score only, no DB writes (true/false)"
        required: false
        default: "false"

jobs:
  pipeline:
    name: Run incorporation pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Build CLI arguments
        id: build_args
        shell: bash
        run: |
          ARGS=""
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            ARGS="$ARGS --date $DATE"
          else
            LOOKBACK="${{ github.event.inputs.lookback }}"
            LOOKBACK="${LOOKBACK:-1}"
            ARGS="$ARGS --lookback $LOOKBACK"
          fi
          if [ "${{ github.event.inputs.skip_difc }}" = "true" ]; then
            ARGS="$ARGS --skip-difc"
          fi
          if [ "${{ github.event.inputs.skip_mauritius }}" = "true" ]; then
            ARGS="$ARGS --skip-mauritius"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        id: run_pipeline
        run: python main.py ${{ steps.build_args.outputs.args }}

      - name: Upload CSV snapshot as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incorporation-snapshot-${{ github.run_id }}
          path: exports/
          retention-days: 90

      - name: Prepare alert context
        if: always()
        id: alert_ctx
        shell: bash
        run: |
          echo "run_date=$(date -u +'%d %b %Y')" >> "$GITHUB_OUTPUT"
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ]; then
            echo "is_monday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_monday=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send failure alert email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: ${{ secrets.ALERT_EMAIL_FROM }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "🔴 ARIE Pipeline Failed — ${{ steps.alert_ctx.outputs.run_date }} — ${{ job.name }}"
          to: ismael@ariefinance.com
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            The ARIE incorporation pipeline failed.

            Job: ${{ job.name }}
            Workflow: ${{ github.workflow }}
            Failed step: Check the run log for the first red step (often "Run pipeline", "Install Playwright browsers", or an earlier setup step).
            Run date (UTC): ${{ steps.alert_ctx.outputs.run_date }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}

            Failed run:
            ${{ steps.alert_ctx.outputs.run_url }}

            What to check:
            1. Companies House API key — HTTP 401 usually means expired or invalid (secret COMPANIES_HOUSE_API_KEY).
            2. Mauritius site unreachable or HTML changed — scraper may return zero rows or timeout.
            3. Supabase connection failed — check SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets.
            4. Playwright browser not installed — "Install Playwright browsers" step may have failed on the runner.

            Re-run manually:
            GitHub → Actions → "Incorporation Intelligence Engine — Daily Pipeline" → Run workflow → choose date/options if needed.

      - name: Send Monday success alert email
        if: success() && github.event_name == 'schedule' && steps.alert_ctx.outputs.is_monday == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: ${{ secrets.ALERT_EMAIL_FROM }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "✅ ARIE Pipeline — Weekly OK — ${{ steps.alert_ctx.outputs.run_date }}"
          to: ismael@ariefinance.com
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            The scheduled ARIE incorporation pipeline completed successfully (Monday weekly check).

            Run date (UTC): ${{ steps.alert_ctx.outputs.run_date }}
            Job: ${{ job.name }}
            Workflow: ${{ github.workflow }}

            Next step for you:
            Spot-check the exports/ folder in the run artifacts (or your local exports/) and confirm today's CSV files look reasonable (UK + Mauritius row counts).

            Successful run:
            ${{ steps.alert_ctx.outputs.run_url }}
